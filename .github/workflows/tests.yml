name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14', '3.15']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pippo_test
          POSTGRES_PASSWORD: pippo_test
          POSTGRES_DB: pippo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://pippo_test:pippo_test@localhost:5432/pippo_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - run: python -m pytest -q
      - name: Check source syntax
        run: python -m compileall -q bot.py config.py database.py flood.py functions.py views.py cogs utils playground colors tests
